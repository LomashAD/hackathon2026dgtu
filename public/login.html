<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Внутренний портал</title>
<link rel="icon" href="/public/favicon.svg">
<link rel="stylesheet" href="/public/fonts/inter.css">
<script>
  // Тема до первой отрисовки: выбор кнопкой ☀/☾ (общий с порталом и чатом), иначе тёмная (DESIGN.md «Graphite»)
  (() => { let t = null; try { t = localStorage.getItem('vite-ui-theme'); } catch (e) {}
    document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; })();
</script>
<style>
  /* DESIGN.md «Graphite»: Obsidian Canvas, рамки Graphite Edge, Inter, кнопка входа — Pale Conversion Button */
  :root { --bg:#0a0a0a; --card:#0a0a0a; --field:#171717; --ink:#fafafa; --muted:#a1a1a1; --ash:#737373; --line:#262626; --steel:#464646;
          --brand:#e5e5e5; --brand-ink:#171717; --hair:rgba(255,255,255,.1); --soft:#171717; --bad:#f2857d; color-scheme:dark;
          --shadow-subtle-3:rgb(255,255,255) 0px 1px 0px 0px inset, rgba(0,0,0,.1) 0px -2px 6px 0px inset; }
  :root[data-theme="light"] { --bg:#fafafa; --card:#ffffff; --field:#ffffff; --ink:#0a0a0a; --muted:#666666; --line:#e5e5e5; --steel:#a1a1a1;
          --brand:#171717; --brand-ink:#fafafa; --hair:rgba(0,0,0,.1); --soft:#f0f0f0; --bad:#b3261e; color-scheme:light;
          --shadow-subtle-3:rgba(255,255,255,.12) 0px 1px 0px 0px inset, rgba(0,0,0,.1) 0px -2px 6px 0px inset; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
         font-family:'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         font-feature-settings:"clig" 0, "liga" 0; -webkit-font-smoothing:antialiased; }
  :focus-visible { outline:2px solid var(--ash); outline-offset:2px; }
  header { position:relative; margin:8px 16px 0; min-height:56px; padding:8px 56px 8px 16px; display:flex; align-items:center; gap:8px;
           border:1px solid var(--line); border-radius:10px; background:var(--bg); box-shadow:rgba(0,0,0,.25) 0px 4px 4px 0px;
           font-size:14px; line-height:20px; font-weight:600; }
  header::before { content:""; width:24px; height:24px; flex:none; background:url("/public/favicon.svg") center / contain no-repeat; }
  #theme { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:8px; border:none;
           background:none; color:var(--muted); cursor:pointer; display:grid; place-items:center; }
  #theme:hover { color:var(--ink); background:var(--soft); }
  #theme svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  :root[data-theme="dark"] #theme .i-sun, :root:not([data-theme="dark"]) #theme .i-moon { display:none; }
  main { flex:1; display:grid; place-items:center; padding:24px 16px; }
  form { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:32px 24px 24px;
         box-shadow:rgba(101,129,128,.15) 0px 0px 2px 2px inset, rgba(32,47,46,.15) 0px 0px 4px 4px inset; }
  h1 { font-size:24px; line-height:1.17; font-weight:600; margin:0 0 8px; }
  .note { font-size:14px; line-height:20px; color:var(--muted); margin:0 0 16px; }
  label { display:block; font-size:14px; line-height:20px; font-weight:500; color:var(--muted); margin:16px 0 8px; }
  input { width:100%; font:inherit; font-size:16px; line-height:20px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
          background:var(--field); color:var(--ink); }
  input:focus { outline:none; border-color:var(--steel); }
  button[type=submit] { width:100%; margin-top:24px; padding:10px 16px; font:inherit; font-size:14px; line-height:20px; font-weight:500;
                        color:var(--brand-ink); background:var(--brand); border:1px solid var(--hair); border-radius:8px; cursor:pointer;
                        box-shadow:var(--shadow-subtle-3); }
  button[type=submit]:hover { opacity:.9; }
  button[type=submit]:disabled { opacity:.5; cursor:default; }
  #error { color:var(--bad); font-size:14px; line-height:20px; margin-top:12px; min-height:1em; }
  @media (max-width: 640px) { header { margin:8px 8px 0; } form { padding:24px 16px 16px; } }
</style>
</head>
<body>
<header>Внутренний портал Организации
  <button id="theme" type="button">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
</header>
<main>
  <form id="form">
    <h1>Вход</h1>
    <p class="note">Учётную запись выдаёт администратор портала.</p>
    <label for="login">Логин</label>
    <input id="login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
    <div id="error" role="alert"></div>
  </form>
</main>
<script>
  const KEY = 'vite-ui-theme', btn = document.getElementById('theme');
  function applyTheme() {
    let t = null; try { t = localStorage.getItem(KEY); } catch (e) {}
    const cur = t === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = cur;
    btn.title = cur === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему';
    btn.setAttribute('aria-label', btn.title);
  }
  btn.onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    document.documentElement.dataset.theme = next;
    applyTheme();
  };
  applyTheme();

  // После входа — на страницу, с которой пришли (только адрес этого же сайта)
  const raw = new URLSearchParams(location.search).get('next') || '/';
  const next = /^\/(?![\/\\])/.test(raw) ? raw : '/';
  const form = document.getElementById('form'), err = document.getElementById('error');
  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    const submit = form.querySelector('button[type=submit]');
    submit.disabled = true;
    try {
      const r = await fetch('/login', {method: 'POST', body: new URLSearchParams(new FormData(form)),
                                       headers: {'Content-Type': 'application/x-www-form-urlencoded'}});
      if (r.ok) { location.replace(next); return; }
      err.textContent = r.status === 401
        ? 'Неверный логин или пароль. После нескольких неудачных попыток подряд вход на время закрывается.'
        : `Не удалось войти (ошибка ${r.status}).`;
    } catch (e) { err.textContent = 'Сервер недоступен.'; }
    submit.disabled = false;
  };
</script>
</body>
</html>
