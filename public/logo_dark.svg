<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 32" width="290" height="32">
  <!-- Логотип для тёмной темы: знак + название, Cloud White -->
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".15" stop-color="#ffb931"/><stop offset=".3" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#ffffff"/><stop offset=".5" stop-color="#2e73fc"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="18" height="18" rx="4.5" fill="none" stroke="#fafafa" stroke-width="1.75" transform="rotate(-12 16 16)"/>
  <rect x="8.5" y="8.5" width="15" height="15" rx="4" fill="none" stroke="url(#spectrum)" stroke-width="1.75" transform="rotate(20 16 16)"/>
  <text x="40" y="21" fill="#fafafa" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="15" font-weight="500">Помощник по документообороту</text>
</svg>
