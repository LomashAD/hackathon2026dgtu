# Производственный календарь РФ для расчёта сроков в рабочих днях (app/approval/deadlines.py).
# Путь к файлу — config.yaml → paths.calendar: администратор заменяет файл без правки кода
# (как добавить следующий год — docs/extensibility.md, раздел «Производственный календарь»).
#
# Годы: 2026 (переносы утверждены), 2027 (предварительно: только то, что прямо следует из ТК РФ).
# Источники:
#   - Трудовой кодекс РФ, ст. 112: нерабочие праздничные дни; выходной, совпавший с праздником, переносится
#     на следующий рабочий день (кроме выходных, совпавших с 1–8 января: их переносит Правительство РФ);
#   - Трудовой кодекс РФ, ст. 95: рабочий день перед нерабочим праздничным днём короче на 1 час;
#   - 2026: постановление Правительства РФ о переносе выходных дней в 2026 году — переносы с субботы 3 января
#     на пятницу 9 января и с воскресенья 4 января на четверг 31 декабря (реквизиты постановления сверить, см. check).
# Актуализирован: 2026-10-24. Внесён вручную, без загрузки из интернета: помощник работает офлайн.
#
# Поля:
#   weekend — выходные дни недели по ISO (6 — суббота, 7 — воскресенье);
#   days_off — нерабочие дни сверх обычных выходных: праздники и перенесённые выходные;
#   work    — рабочие субботы и воскресенья по переносу (в 2026 году их нет);
#   short   — сокращённые предпраздничные дни: рабочие, на 1 час короче (в счёте срока это полный рабочий день);
#   status  — confirmed: переносы утверждены; preliminary: переносы не внесены, в ответе — предупреждение;
#   check   — что требует проверки по официальному тексту.
# Для дат вне перечисленных годов считаются только выходные (суббота и воскресенье), в ответе — предупреждение
# «праздничные дни за этот период не учтены».

weekend: [6, 7]

years:
  2026:
    status: confirmed
    days_off:
      - 2026-01-01   # Новогодние каникулы (ст. 112 ТК РФ: 1–6 и 8 января)
      - 2026-01-02
      - 2026-01-03
      - 2026-01-04
      - 2026-01-05
      - 2026-01-06
      - 2026-01-07   # Рождество Христово
      - 2026-01-08
      - 2026-01-09   # перенос выходного с субботы 3 января
      - 2026-02-23   # День защитника Отечества (понедельник)
      - 2026-03-09   # 8 марта — воскресенье, выходной переносится на понедельник 9 марта (ст. 112)
      - 2026-05-01   # Праздник Весны и Труда (пятница)
      - 2026-05-11   # 9 мая — суббота, выходной переносится на понедельник 11 мая (ст. 112)
      - 2026-06-12   # День России (пятница)
      - 2026-11-04   # День народного единства (среда)
      - 2026-12-31   # перенос выходного с воскресенья 4 января
    work: []
    short:
      - 2026-04-30   # перед 1 мая
      - 2026-05-08   # перед 9 мая
      - 2026-06-11   # перед 12 июня
      - 2026-11-03   # перед 4 ноября
    check:
      - "Реквизиты постановления Правительства РФ о переносе выходных дней в 2026 году (по памяти — от 24.09.2025 № 1466) сверить с официальной публикацией; сами переносы 3.01 → 9.01 и 4.01 → 31.12 внесены"

  2027:
    status: preliminary
    days_off:
      - 2027-01-01   # Новогодние каникулы (ст. 112 ТК РФ: 1–6 и 8 января)
      - 2027-01-02
      - 2027-01-03
      - 2027-01-04
      - 2027-01-05
      - 2027-01-06
      - 2027-01-07   # Рождество Христово
      - 2027-01-08
      - 2027-02-23   # День защитника Отечества (вторник)
      - 2027-03-08   # Международный женский день (понедельник)
      - 2027-05-03   # 1 мая — суббота, выходной переносится на понедельник 3 мая (ст. 112)
      - 2027-05-10   # 9 мая — воскресенье, выходной переносится на понедельник 10 мая (ст. 112)
      - 2027-06-14   # 12 июня — суббота, выходной переносится на понедельник 14 июня (ст. 112)
      - 2027-11-04   # День народного единства (четверг)
    work: []
    short:
      - 2027-02-22   # перед 23 февраля
      - 2027-04-30   # перед 1 мая
      - 2027-06-11   # перед 12 июня
      - 2027-11-03   # перед 4 ноября
      - 2027-12-31   # перед 1 января 2028 — если 31 декабря не станет выходным по переносу (см. check)
    check:
      - "Перенос выходных 2 и 3 января 2027 г. (суббота и воскресенье совпали с новогодними праздниками) устанавливает постановление Правительства РФ о переносе выходных дней в 2027 году — в календарь не внесён"
      - "Возможные дополнительные переносы 2027 г. (например, рабочая суббота и выходной «мост» между праздником и выходными) — по тому же постановлению, не внесены"
      - "31 декабря 2027 г. внесён как сокращённый рабочий день; если постановление сделает его выходным — перенести в days_off"
