id: order_handover
title: Приказ о приеме и передаче дел и имущества
doc_kind: order
source_file: data/Модуль_приказа_о_приеме_и_передаче_дел_и_имущества.docx
description: >
  Прием и передача дел и имущества при назначении на должность, освобождении от должности, переводе,
  реорганизации подразделения; сдающий, принимающий, представитель Организации.
keywords: ["при[её]м\\w*.{0,15}передач\\w* дел", "передач\\w* дел", "сдач\\w* дел", "передать дела"]
matrix_row: internal-2
matrix_conditions:
  - field: is_access
    unit: Департамент информационной безопасности

fields:
  - name: reason
    question: В связи с чем передаются дела и имущество? (продолжите «В связи с …»)
    type: text
    hint: "Прим. 1: назначение нового руководителя, освобождение от должности, перевод, реорганизация."
    example: назначением П. П. Петрова на должность директора Административного департамента
  - name: giver
    question: Кто сдаёт дела? Должность, подразделение, И. О. Фамилия — в дательном падеже
    type: person
    hint: "Прим. 2: формулировка сочетается со словом «сдать»."
    example: заместителю директора Административного департамента И. И. Иванову
  - name: receiver
    question: Кто принимает дела? Должность, подразделение, И. О. Фамилия — в дательном падеже
    type: person
    hint: "Прим. 3: формулировка сочетается со словом «принять»."
    example: директору Административного департамента П. П. Петрову
  - name: items
    question: Какие дела и имущество передаются? (продолжите «принять дела и имущество …»)
    type: text
    hint: "Прим. 4: если перечень большой — «согласно акту приема-передачи»."
    default: согласно акту приема-передачи
  - name: source
    question: От кого принимаются дела? (продолжите «от …») — или «нет», если это ясно из начала пункта
    type: text
    optional: true
    hint: "Прим. 5: если оборот дублирует сведения, он удаляется."
  - name: representative
    question: Кто назначается представителем Организации при передаче? Должность, подразделение, И. О. Фамилия — в винительном падеже
    type: person
    hint: "Прим. 6 и общие правила: представитель не должен совпадать со сдающим или принимающим."
    example: начальника отдела кадров С. С. Сергееву
  - name: control
    question: На кого возложить контроль за исполнением? (в винительном падеже) или «оставляю за собой»
    type: control
    doc_word: приказа
    example: заместителя Председателя Организации А. Б. Васильева
  - name: signer
    question: Председатель Организации, подписывающий приказ (И. О. Фамилия)?
    type: signer
    example: В. Г. Председателев
  - name: is_access
    question: Связана ли передача дел с предоставлением, изменением или прекращением доступа к информационным системам? (да/нет)
    type: yesno
    hint: "От ответа зависит обязательная виза Департамента информационной безопасности (Матрица, строка 2)."

layout:
  - {match: "В связи с", text: "В связи с {{ reason }},"}
  - {match: "1. ", text: "1. {{ giver[:1]|upper ~ giver[1:] }} сдать, а {{ receiver }} принять дела и имущество {{ items }}{% if source %} от {{ source }}{% endif %} в порядке, предусмотренном Положением о порядке приема и передачи дел и имущества при назначении на должность и освобождении от должности руководителей структурных подразделений Организации."}
  - {match: "2. Назначить", text: "2. Назначить {{ representative }} представителем Организации при приеме и передаче дел и имущества."}
  - {match: "3. Контроль", text: "3. {{ control }}"}
tables:
  - {match: "И. О. Фамилия", cell: 2, text: "{{ signer }}"}

checklist:
  - {text: "Распорядительная часть начинается словом «ПРИКАЗЫВАЮ:» отдельной строкой", ref: "instr_dou:9.5.4"}
  - {text: "Каждое поручение определяет действие, исполнителя и срок; укажите срок приема-передачи", ref: "instr_dou:9.5.5"}
  - {text: "Акт приема-передачи: перечень объектов, количество, состояние, подписи сторон", ref: "instr_dou:9.14"}
  - {text: "Передача документов при смене работника — по акту", ref: "instr_dou:2.4"}
  - {text: "Срок рассмотрения проекта приказа — не более 10 рабочих дней", ref: "instr_dou:10.3"}
  - {text: "Обязательна лингвистическая экспертиза", ref: "instr_dou:10.13"}
  - {text: "Удалить линии и номера примечаний; сохранить зоны даты/номера и ЭП", ref: "mr_modules:3.3"}
