id: order_records_responsible
title: Приказ о назначении ответственных за делопроизводство
doc_kind: order
source_file: data/Модуль_приказа_о_назначении_ответственных_за_делопроизводство.docx
description: >
  Назначение работников, ответственных за делопроизводство и документооборот в подразделениях;
  координатор, замещение ответственных, отмена прежнего приказа.
keywords: ["ответственн\\w* за (делопроизводств|документооборот|доу)", "назнач\\w*.{0,30}делопроизводств"]
matrix_row: internal-4

fields:
  - name: basis
    question: Соблюдение какого документа обеспечивается? (продолжите «соблюдения требований …»)
    type: text
    default: Инструкции по документационному обеспечению управления и документообороту Организации
    hint: "Прим. 1 модуля: наименование инструкции по делопроизводству, правил работы в СЭД."
  - name: responsible
    question: "Кого назначить ответственными? Каждая строка: «Подразделение — должность И. О. Фамилия»"
    type: pairs
    hint: "Прим. 2: для каждого подразделения — официальное наименование, должность, инициалы и фамилия."
    example: "Административный департамент — главный специалист А. А. Антонова"
  - name: notify_unit
    question: Куда руководители сообщают об изменениях? (продолжите «сообщать об изменениях в …»)
    type: text
    default: Департамент документационного обеспечения
    hint: "Прим. 3: подразделение, которое ведёт сводный перечень ответственных лиц."
  - name: coordinator
    question: Какое подразделение осуществляет методическое сопровождение? (в дательном падеже)
    type: text
    default: Департаменту документационного обеспечения
    hint: "Прим. 4; п. 2.1 Инструкции — Департамент ДОУ руководит процессами ДОУ."
  - name: repealed
    question: Признаётся ли утратившим силу прежний приказ? Если да — дата, номер, название; иначе «нет»
    type: text
    optional: true
    hint: "Прим. 5: пункт необязательный."
  - name: control
    question: На кого возложить контроль за исполнением? (в винительном падеже) или «оставляю за собой»
    type: control
    doc_word: приказа
    example: директора Департамента документационного обеспечения И. И. Кузнецова
  - name: signer
    question: Кто подписывает приказ? (И. О. Фамилия)
    type: signer
    example: А. Б. Васильев

numbering: [p1, p2, p3, p4, {key: p5, if: repealed}, p6]

layout:
  - {match: "В целях организации делопроизводства", text: "В целях организации делопроизводства и соблюдения требований {{ basis }},"}
  - {match: "3. Руководителям подразделений", text: "3. Руководителям подразделений обеспечивать замещение ответственных лиц на период отсутствия и сообщать об изменениях в {{ notify_unit }}."}
  - {match: "4. ", text: "4. {{ coordinator }} осуществлять методическое сопровождение и координацию работы ответственных лиц."}
  - {match: "5. [Признать", text: "{{ num.p5 }}. Признать утратившим силу {{ repealed }}.", if: repealed}
  - {match: "6. Контроль", text: "{{ num.p6 }}. {{ control }}"}
tables:
  - {match: "И. О. Фамилия", cell: 2, text: "{{ signer }}"}
row_tables:
  - {header: "Подразделение", var: responsible, cols: [left, right]}

checklist:
  - {text: "Распорядительная часть начинается словом «ПРИКАЗЫВАЮ:» отдельной строкой", ref: "instr_dou:9.5.4"}
  - {text: "Руководитель подразделения обеспечивает назначение работников, ответственных за ДОУ", ref: "instr_dou:2.3"}
  - {text: "Определено лицо, контролирующее исполнение", ref: "instr_dou:9.5.9"}
  - {text: "Срок рассмотрения проекта приказа — не более 10 рабочих дней", ref: "instr_dou:10.3"}
  - {text: "Обязательна лингвистическая экспертиза", ref: "instr_dou:10.13"}
  - {text: "Удалить необязательные скобки, линии и номера примечаний", ref: "mr_modules:3.3"}
