id: disp_working_group
title: Распоряжение о создании рабочей группы
doc_kind: disposition
source_file: data/Модуль_распоряжения_о_создании_рабочей_группы.docx
description: >
  Создание временной рабочей группы для подготовки документа, анализа вопроса, внедрения изменения,
  выработки предложений или решения иной ограниченной задачи; состав, срок, результат.
keywords: ["рабоч\\w* групп"]
matrix_row: internal-6
matrix_conditions:
  - field: it_project
    unit: Департамент информационных технологий

fields:
  - name: subject
    question: По какому вопросу создаётся рабочая группа? (продолжите фразу «рабочая группа по …»)
    type: text
    hint: "Прим. 2 модуля: тема формулируется кратко и одинаково в заголовке и пункте 1."
    example: подготовке проекта Регламента электронного архива
  - name: goal
    question: С какой целью создаётся рабочая группа? (продолжите «В целях …»)
    type: text
    hint: "Прим. 1: подготовка документа, анализ вопроса, внедрение изменения, выработка предложений."
    example: подготовки и согласования проекта Регламента электронного архива
  - name: leader
    question: Кто руководитель рабочей группы? (должность, подразделение, И. О. Фамилия)
    type: person
    hint: "Прим. 3: укажите должность, подразделение, инициалы и фамилию."
    example: начальник Управления архивного хранения Департамента ДОУ И. И. Иванов
  - name: secretary
    question: Кто секретарь рабочей группы? (должность, подразделение, И. О. Фамилия)
    type: person
    example: главный специалист Департамента ДОУ П. П. Петрова
  - name: members
    question: Перечислите членов рабочей группы — каждого с новой строки или через «;» (должность, подразделение, И. О. Фамилия)
    type: people
    hint: "Для внешних участников при необходимости добавьте «(по согласованию)»."
    example: "ведущий эксперт Департамента ИТ С. С. Сидоров; юрисконсульт Юридического департамента А. А. Смирнова"
  - name: deadline
    question: До какой даты рабочая группа должна выполнить задачу? (ДД.ММ.ГГГГ)
    type: date
    hint: "Прим. 4: укажите конечную дату."
    example: 15.12.2026
  - name: action
    question: Что конкретно должна сделать рабочая группа к этому сроку? (глагол в неопределённой форме)
    type: text
    hint: "П. 9.7.5 Инструкции: распорядительная часть содержит действия, исполнителей и сроки."
    example: разработать проект Регламента электронного архива
  - name: result
    question: Какой результат и кому представить? (продолжите «…и представить …»)
    type: text
    hint: "Прим. 5: итоговый документ и адресат."
    example: проект Регламента в Департамент документационного обеспечения
  - name: end_event
    question: После какого события рабочая группа прекращает деятельность? (продолжите «…после …»)
    type: text
    hint: "Прим. 6: представление результата, утверждение документа или принятие решения."
    example: утверждения Регламента электронного архива
  - name: control
    question: На кого возложить контроль за исполнением? (должность, подразделение, И. О. Фамилия — в винительном падеже) или напишите «оставляю за собой»
    type: control
    doc_word: распоряжения
    example: директора Департамента документационного обеспечения И. И. Кузнецова
  - name: signer
    question: Кто подписывает распоряжение? (И. О. Фамилия заместителя Председателя)
    type: signer
    example: А. Б. Васильев
  - name: it_project
    question: Рабочая группа создаётся для ИТ-проекта или вопросов информационных систем? (да/нет)
    type: yesno
    hint: "От ответа зависит обязательная виза Департамента ИТ по Матрице визирования (строка 6)."

layout:
  - {match: "О создании рабочей группы по", text: "О создании рабочей группы по {{ subject }}"}
  - {match: "В целях", text: "В целях {{ goal }},"}
  - {match: "1. Создать рабочую группу", text: "1. Создать рабочую группу по {{ subject }} (далее - Рабочая группа) в составе:"}
  - {match: "2. Рабочей группе до", text: "2. Рабочей группе до {{ deadline }} {{ action }} и представить {{ result }}."}
  - {match: "5. Рабочая группа прекращает", text: "5. Рабочая группа прекращает деятельность после {{ end_event }}."}
  - {match: "6. Контроль", text: "6. {{ control }}"}
tables:
  - {match: "Руководитель", cell: 1, text: "{{ leader }}"}
  - {match: "Секретарь", cell: 1, text: "{{ secretary }}"}
  - {match: "Члены", cell: 1, text: "{{ members }}"}
  - {match: "И. О. Фамилия", cell: 2, text: "{{ signer }}"}

checklist:
  - {text: "Распорядительная часть начинается словом «ОБЯЗЫВАЮ:» отдельной строкой", ref: "instr_dou:9.7.4"}
  - {text: "Каждое поручение содержит действие, исполнителя и срок; указано лицо, контролирующее исполнение", ref: "instr_dou:9.7.5"}
  - {text: "Распоряжение о временной рабочей группе — вопрос, по которому издаётся распоряжение", ref: "instr_dou:9.7.1"}
  - {text: "Срок рассмотрения проекта распоряжения каждым подразделением — не более 3 рабочих дней", ref: "instr_dou:10.3"}
  - {text: "Обязательна лингвистическая экспертиза (распоряжения Организации)", ref: "instr_dou:10.13"}
  - {text: "Документ строго по модулю не требует повторного полного согласования; визирование ДОУ сохраняется", ref: "instr_dou:9.16.1"}
  - {text: "В поле «Примечание» РК указать, что проект подготовлен на основе модуля", ref: "mr_modules:2.3"}
  - {text: "Удалить линии, номера примечаний, пометку «МОДУЛЬНЫЙ ДОКУМЕНТ», сохранить зоны даты/номера и ЭП", ref: "mr_modules:3.3"}
