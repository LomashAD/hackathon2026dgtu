id: disp_internal_audit
title: Распоряжение о проведении внутреннего аудита процессов
doc_kind: disposition
source_file: data/Модуль_распоряжения_о_проведении_внутреннего_аудита_процессов.docx
description: >
  Проведение внутреннего аудита процесса или процессов: сроки, состав аудиторской группы,
  проверяемое подразделение, отчёт и план мероприятий по результатам аудита.
keywords: ["аудит"]
matrix_row: internal-7

fields:
  - name: processes
    question: Какой процесс (или процессы) проверяется? Точные наименования; несколько — через «;»
    type: text
    hint: "Прим. 2 модуля: число (процесса/процессов) подставится автоматически."
    example: регистрации входящих документов
  - name: basis
    question: На каком основании проводится аудит? (продолжите «В соответствии с …», с реквизитами)
    type: text
    hint: "Прим. 1: годовой план внутреннего аудита, поручение, решение коллегиального органа."
    example: Планом внутреннего аудита на 2026 год, утвержденным 20.01.2026 № ПА-3
  - name: date_from
    question: Дата начала аудита? (ДД.ММ.ГГГГ)
    type: date
    example: 02.11.2026
  - name: date_to
    question: Дата окончания аудита? (ДД.ММ.ГГГГ)
    type: date
    not_before: date_from
    example: 20.11.2026
  - name: leader
    question: Кто руководитель аудиторской группы? (должность, подразделение, И. О. Фамилия)
    type: person
    hint: "Прим. 3: учитывайте компетентность и независимость от проверяемой деятельности."
    example: начальник отдела внутреннего аудита Г. Г. Громов
  - name: auditors
    question: Перечислите аудиторов — каждого с новой строки или через «;»
    type: people
    example: "главный аудитор Д. Д. Дмитриева; ведущий аудитор Е. Е. Ершов"
  - name: audited_unit
    question: Какое подразделение обеспечивает доступ к документам? (в дательном падеже, продолжите «… обеспечить аудиторской группе доступ»)
    type: text
    hint: "Прим. 4: владелец процесса или подразделение, предоставляющее документы и доступ."
    example: Департаменту документационного обеспечения
  - name: report_date
    question: До какой даты руководитель группы представляет отчёт? (ДД.ММ.ГГГГ)
    type: date
    not_before: date_to
    example: 27.11.2026
  - name: report_to
    question: Кому представляется отчёт? (в дательном падеже)
    type: text
    hint: "Прим. 5: срок и адресат отчёта."
    example: заместителю Председателя Организации А. Б. Васильеву
  - name: plan_owner
    question: Какое подразделение готовит план мероприятий по результатам? (в дательном падеже)
    type: text
    hint: "Прим. 6: подразделение — владелец корректирующих мероприятий."
    example: Департаменту документационного обеспечения
  - name: plan_date
    question: До какой даты подготовить план мероприятий? (ДД.ММ.ГГГГ)
    type: date
    not_before: report_date
    example: 11.12.2026
  - name: control
    question: На кого возложить контроль за исполнением? (должность, И. О. Фамилия — в винительном падеже) или «оставляю за собой»
    type: control
    doc_word: распоряжения
    example: директора Департамента внутреннего контроля К. К. Козлова
  - name: signer
    question: Кто подписывает распоряжение? (И. О. Фамилия заместителя Председателя)
    type: signer
    example: А. Б. Васильев

derived:
  proc_gen: "{{ 'процессов' if processes_plural else 'процесса' }}"

layout:
  - {match: "О проведении внутреннего аудита", text: "О проведении внутреннего аудита {{ proc_gen }} {{ processes }}"}
  - {match: "В соответствии с", text: "В соответствии с {{ basis }}, в целях оценки результативности процессов и управления связанными с ними рисками,"}
  - {match: "1. Провести с", text: "1. Провести с {{ date_from }} по {{ date_to }} внутренний аудит {{ proc_gen }} {{ processes }}."}
  - {match: "4. ", text: "4. {{ audited_unit }} обеспечить аудиторской группе доступ к документам, информационным системам и работникам в пределах программы аудита."}
  - {match: "5. Руководителю аудиторской группы", text: "5. Руководителю аудиторской группы до {{ report_date }} представить {{ report_to }} отчет о результатах аудита."}
  - {match: "6. ", text: "6. {{ plan_owner }} до {{ plan_date }} подготовить план мероприятий по результатам аудита."}
  - {match: "7. Контроль", text: "7. {{ control }}"}
tables:
  - {match: "Руководитель", cell: 1, text: "{{ leader }}"}
  - {match: "Аудиторы", cell: 1, text: "{{ auditors }}"}
  - {match: "И. О. Фамилия", cell: 2, text: "{{ signer }}"}

checklist:
  - {text: "Распорядительная часть начинается словом «ОБЯЗЫВАЮ:» отдельной строкой", ref: "instr_dou:9.7.4"}
  - {text: "Распорядительная часть содержит действия, исполнителей и сроки; указан контролирующий", ref: "instr_dou:9.7.5"}
  - {text: "Формулировка «до» даты не включает эту дату, «не позднее» — включает", ref: "instr_dou:6.4"}
  - {text: "Срок рассмотрения проекта распоряжения — не более 3 рабочих дней", ref: "instr_dou:10.3"}
  - {text: "Обязательна лингвистическая экспертиза", ref: "instr_dou:10.13"}
  - {text: "Удалить неиспользованные варианты, линии и номера примечаний", ref: "mr_modules:3.3"}
