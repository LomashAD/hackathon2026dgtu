id: order_is_commissioning
title: Приказ о вводе в эксплуатацию информационной системы
doc_kind: order
source_file: data/Модуль_приказа_о_вводе_в_эксплуатацию_информационной_системы.docx
description: >
  Ввод в промышленную эксплуатацию информационной системы или её компонента (подсистемы, модуля, сервиса)
  на основании протокола испытаний или акта приемки; функциональный заказчик, сопровождение.
keywords: ["ввод\\w*.{0,40}в (промышленн\\w* )?эксплуатаци", "ввести.{0,40}в эксплуатаци", "информационн\\w* систем"]
matrix_row: internal-3

fields:
  - name: system_full
    question: Полное официальное наименование вводимой системы или компонента?
    type: text
    hint: "Прим. 1 и 3 модуля: написание должно совпадать с технической и приемочной документацией."
    example: «Подсистема электронного архива ИИС ДО»
  - name: short_name
    question: Сокращённое наименование, которое будет использоваться далее в приказе?
    type: text
    hint: "Прим. 4: одинаковое написание и кавычки по всему документу (подставится в пункты 1, 2, 3 автоматически)."
    example: Электронный архив
  - name: readiness_doc
    question: Документ о готовности к вводу — вид, дата, номер (в родительном падеже, продолжите «На основании …»)?
    type: text
    hint: "Прим. 2: протокол приемочных испытаний, акт приемки, протокол завершения опытной эксплуатации."
    example: протокола приемочных испытаний от 20.10.2026 № 15
  - name: dev_kind
    question: Компонент разработан впервые или изменён (новая версия)?
    type: choice
    options: [разработанного, измененного]
    synonyms: {разработанного: [впервые, новый, разработан, создан], измененного: [изменен, версия, доработ, модифик]}
    hint: "Прим. 5: «разработанного» — создан впервые, «измененного» — новая версия или доработка."
  - name: basis_doc
    question: В соответствии с каким документом выполнены работы? (вид, дата, номер — в творительном падеже)
    type: text
    hint: "Прим. 6: техническое задание, функциональные требования, заявка на изменение."
    example: техническим заданием от 01.03.2026 № ТЗ-12
  - name: start_date
    question: Дата начала промышленной эксплуатации? (ДД.ММ.ГГГГ)
    type: date
    hint: "Прим. 8: не раньше даты документа о готовности."
    example: 01.12.2026
  - name: customer_unit
    question: Функциональный заказчик — подразделение, которое обеспечит применение (в дательном падеже)?
    type: text
    hint: "Прим. 9: полное официальное наименование подразделения — владельца бизнес-процесса."
    example: Департаменту документационного обеспечения
  - name: purpose
    question: Для чего будет применяться система? (конкретное функциональное назначение)
    type: text
    hint: "Прим. 11: формулировка должна быть проверяемой."
    example: ведения электронного архива документов Организации
  - name: responsible
    question: Ответственный за исполнение приказа — должность и фамилия с инициалами (в именительном падеже)?
    type: person
    hint: "Прим. 14: например, «директор Департамента информационных технологий Иванов И. И.»."
    example: директор Департамента информационных технологий Иванов И. И.
  - name: signer
    question: Заместитель Председателя, подписывающий приказ (И. О. Фамилия)?
    type: signer
    example: А. Б. Васильев

layout:
  - {match: "О вводе в эксплуатацию", text: "О вводе в эксплуатацию компонента информационной системы {{ system_full }}"}
  - {match: "На основании", text: "На основании {{ readiness_doc }}, содержащего решение о готовности к вводу в эксплуатацию компонента информационной системы {{ system_full }} (далее - «{{ short_name }}»), {{ dev_kind }} в соответствии с {{ basis_doc }},"}
  - {match: "1. Ввести", text: "1. Ввести «{{ short_name }}» в эксплуатацию с {{ start_date }}"}
  - {match: "2. ", text: "2. {{ customer_unit }}"}
  - {match: "обеспечить применение", text: "обеспечить применение «{{ short_name }}» по следующему назначению: {{ purpose }}."}
  - {match: "3.1. функционирование", text: "3.1. функционирование «{{ short_name }}» в соответствии с эксплуатационной документацией;"}
  - {match: "3.2. сопровождение", text: "3.2. сопровождение «{{ short_name }}» с привлечением при необходимости внешних подрядных организаций."}
  - {match: "4. Ответственным", text: "4. Ответственным за исполнение настоящего приказа является {{ responsible }}."}
tables:
  - {match: "И. О. Фамилия", cell: 2, text: "{{ signer }}"}

checklist:
  - {text: "Приказ о вводе ИС указывает объект, основание и результаты испытаний, дату ввода, владельца, сопровождающее подразделение и др.", ref: "instr_dou:9.5.6"}
  - {text: "Ввод в эксплуатацию информационных систем — вопрос приказа Организации", ref: "instr_dou:9.5.1"}
  - {text: "Распорядительная часть начинается словом «ПРИКАЗЫВАЮ:» отдельной строкой", ref: "instr_dou:9.5.4"}
  - {text: "Определено лицо, контролирующее исполнение", ref: "instr_dou:9.5.9"}
  - {text: "Срок рассмотрения проекта приказа — не более 10 рабочих дней", ref: "instr_dou:10.3"}
  - {text: "Обязательна лингвистическая экспертиза", ref: "instr_dou:10.13"}
  - {text: "Не оставлять линии, варианты через «/» и номера примечаний", ref: "mr_modules:3.3"}
