id: order_local_act
title: Приказ об утверждении и введении в действие локального акта
doc_kind: order
source_file: data/Модуль_приказа_об_утверждении_и_введении_в_действие_локального.docx
description: >
  Утверждение и введение в действие положения, правил, регламента, инструкции или порядка (локального акта);
  дата введения, ознакомление работников, размещение, отмена прежнего документа.
keywords: ["утвержд\\w*.{0,40}(регламент|положени|порядк|правил|инструкци|локальн)", "введени\\w* в действие", "ввести в действие"]
matrix_row: internal-4

fields:
  - name: act_gen
    question: Какой документ утверждается? Укажите вид и полное наименование в родительном падеже (для заголовка «Об утверждении и введении в действие …»)
    type: text
    hint: "Прим. 2 модуля и общие правила: название в заголовке, пункте 1 и приложении должно совпадать."
    example: Регламента работы с обращениями граждан
  - name: act_acc
    question: То же наименование в винительном падеже (для пункта «Утвердить …»)
    type: text
    example: Регламент работы с обращениями граждан
  - name: goal
    question: С какой целью принимается документ? (продолжите «В целях …»)
    type: text
    hint: "Прим. 1: регулирование процесса, распределение полномочий, изменение требований."
    example: упорядочения работы с обращениями граждан
  - name: start_date
    question: С какой даты документ вводится в действие? (ДД.ММ.ГГГГ)
    type: date
    hint: "Прим. 3; п. 9.5.8 Инструкции: приказ действует с даты регистрации, если не установлена иная дата."
    example: 01.12.2026
  - name: resp_unit
    question: Какое подразделение организует ознакомление и размещение? (в дательном падеже)
    type: text
    hint: "Прим. 4: полное наименование подразделения."
    example: Департаменту документационного обеспечения
  - name: placement
    question: Где разместить актуальную редакцию документа? (продолжите «размещение актуальной редакции документа …»)
    type: text
    default: на внутреннем информационном портале Организации
    hint: "Прим. 5; п. 12.10 Инструкции — внутренний информационный портал."
  - name: repealed
    question: Признаётся ли утратившим силу прежний документ? Если да — вид, дата, номер и название; иначе «нет»
    type: text
    optional: true
    hint: "Прим. 6: пункт необязательный, при отсутствии удаляется с перенумерацией."
    example: приказ Организации от 10.02.2025 № ОД-15 «Об утверждении Регламента работы с обращениями»
  - name: control
    question: На кого возложить контроль за исполнением? (должность, подразделение, И. О. Фамилия — в винительном падеже) или «оставляю за собой»
    type: control
    doc_word: приказа
    example: директора Департамента документационного обеспечения И. И. Кузнецова
  - name: signer
    question: Кто подписывает приказ? (И. О. Фамилия)
    type: signer
    example: А. Б. Васильев

numbering: [p1, p2, p3, {key: p4, if: repealed}, p5]

layout:
  - {match: "Об утверждении и введении в действие", text: "Об утверждении и введении в действие {{ act_gen }}"}
  - {match: "В целях", text: "В целях {{ goal }},"}
  - {match: "1. Утвердить", text: "1. Утвердить {{ act_acc }} согласно приложению к настоящему приказу."}
  - {match: "2. Ввести указанный документ", text: "2. Ввести указанный документ в действие с {{ start_date }}"}
  - {match: "3. ", text: "3. {{ resp_unit }} обеспечить:"}
  - {match: "• размещение актуальной редакции", text: "• размещение актуальной редакции документа {{ placement }}."}
  - {match: "4. [Признать", text: "{{ num.p4 }}. Признать утратившим силу {{ repealed }}.", if: repealed}
  - {match: "5. Контроль", text: "{{ num.p5 }}. {{ control }}"}
tables:
  - {match: "И. О. Фамилия", cell: 2, text: "{{ signer }}"}

checklist:
  - {text: "Распорядительная часть начинается словом «ПРИКАЗЫВАЮ:» отдельной строкой", ref: "instr_dou:9.5.4"}
  - {text: "Каждое поручение определяет действие, исполнителя и срок", ref: "instr_dou:9.5.5"}
  - {text: "Приказ может признать утратившим силу прежний приказ; дата начала действия", ref: "instr_dou:9.5.8"}
  - {text: "Определено лицо, контролирующее исполнение", ref: "instr_dou:9.5.9"}
  - {text: "Пояснительная записка обязательна для регламентов и приказов объёмом более трёх страниц", ref: "instr_dou:10.12"}
  - {text: "Срок рассмотрения проекта приказа — не более 10 рабочих дней", ref: "instr_dou:10.3"}
  - {text: "Обязательна лингвистическая экспертиза", ref: "instr_dou:10.13"}
  - {text: "Удалить квадратные скобки, линии и номера примечаний", ref: "mr_modules:3.3"}
