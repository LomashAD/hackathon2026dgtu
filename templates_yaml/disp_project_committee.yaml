id: disp_project_committee
title: Распоряжение о создании проектного комитета
doc_kind: disposition
source_file: data/Модуль_распоряжения_о_создании_проектного_комитета.docx
description: >
  Создание проектного комитета по проекту или проектам для координации и контроля реализации проекта;
  состав комитета (председатель, заместитель, секретарь, члены), при необходимости отмена прежнего распоряжения.
keywords: ["проектн\\w* комитет", "комитет\\w* по проект"]
matrix_row: internal-6
matrix_conditions:
  - field: it_project
    unit: Департамент информационных технологий

fields:
  - name: projects
    question: По какому проекту (или проектам) создаётся комитет? Полное наименование; несколько — через «;»
    type: text
    hint: "Прим. 1, 5, 7 модуля: наименования должны совпадать в заголовке, преамбуле и пункте 1; число (проекту/проектам) подставится автоматически."
    example: «Цифровой архив Организации»
  - name: goal
    question: Какова цель издания распоряжения? (продолжите «В целях …»)
    type: text
    hint: "Прим. 3: например, «координации деятельности участников проекта и контроля сроков его реализации»."
    example: координации деятельности участников проекта и контроля сроков его реализации
  - name: reason
    question: В связи с чем создаётся комитет? (продолжите «в связи с …») — или «нет», если отдельная причина не нужна
    type: text
    optional: true
    hint: "Прим. 4: запуск проекта, изменение этапа, необходимость межфункциональной координации."
    example: запуском проекта
  - name: unit
    question: Каким подразделением реализуется проект? (в творительном падеже, продолжите «реализуемого …»)
    type: text
    hint: "Прим. 6: полное наименование структурного подразделения."
    example: Департаментом информационных технологий
  - name: chair
    question: Кто председатель Комитета? (должность, подразделение, И. О. Фамилия)
    type: person
    example: заместитель Председателя Организации А. Б. Васильев
  - name: deputy
    question: Кто заместитель председателя Комитета? (должность, подразделение, И. О. Фамилия)
    type: person
    example: директор Департамента информационных технологий В. В. Орлов
  - name: secretary
    question: Кто секретарь Комитета? (должность, подразделение, И. О. Фамилия)
    type: person
    example: главный специалист Департамента ИТ Е. Е. Белова
  - name: members
    question: Перечислите членов Комитета — каждого с новой строки или через «;»
    type: people
    hint: "Прим. 8: для участников не от Организации добавьте «по согласованию»."
    example: "директор Департамента ДОУ И. И. Кузнецов; директор Юридического департамента Н. Н. Новикова"
  - name: prev_order
    question: Отменяется ли прежнее распоряжение о проектном комитете? Если да — укажите его дату и номер (например «от 12.03.2025 № Р-45»), иначе «нет»
    type: text
    optional: true
    hint: "Прим. 2 и 9: при отмене часть заголовка и пункт 2 сохраняются, иначе удаляются с перенумерацией."
  - name: prev_title
    question: Наименование отменяемого распоряжения? (как в его заголовке)
    type: text
    only_if: prev_order
    example: О создании проектного комитета по проекту «Электронный архив»
  - name: control
    question: На кого возложить контроль за исполнением? (должность, И. О. Фамилия — в винительном падеже) или «оставляю за собой»
    type: control
    doc_word: распоряжения
    example: директора Департамента ИТ В. В. Орлова
  - name: it_project
    question: Это ИТ-проект или проект по вопросам информационных систем? (да/нет)
    type: yesno
    hint: "От ответа зависит обязательная виза Департамента ИТ по Матрице визирования (строка 6)."

derived:
  proj_dat: "{{ 'проектам' if projects_plural else 'проекту' }}"
  proj_gen: "{{ 'проектов' if projects_plural else 'проекта' }}"
  realized: "{{ 'реализуемых' if projects_plural else 'реализуемого' }}"

numbering: [p1, {key: p2, if: prev_order}, p3]

layout:
  - {match: "О создании проектного комитета", text: "О создании проектного комитета по {{ proj_dat }} {{ projects }}{% if prev_order %} и об отмене распоряжения Организации {{ prev_order }}{% endif %}"}
  - {match: "В целях", text: "В целях {{ goal }},{% if reason %} в связи с {{ reason }},{% endif %} для обеспечения координации и контроля реализации {{ proj_gen }} {{ projects }}, {{ realized }} {{ unit }},"}
  - {match: "1. Создать Проектный комитет", text: "1. Создать Проектный комитет по {{ proj_dat }} {{ projects }} (далее - Комитет) в составе:"}
  - {match: "2. [Отменить", text: "{{ num.p2 }}. Отменить распоряжение Организации {{ prev_order }} «{{ prev_title }}».", if: prev_order}
  - {match: "3. Контроль", text: "{{ num.p3 }}. {{ control }}"}
tables:
  - {match: "Председатель Комитета", cell: 1, text: "{{ chair }}"}
  - {match: "Заместитель председателя", cell: 1, text: "{{ deputy }}"}
  - {match: "Секретарь Комитета", cell: 1, text: "{{ secretary }}"}
  - {match: "Члены Комитета", cell: 1, text: "{{ members }}"}

checklist:
  - {text: "Распорядительная часть начинается словом «ОБЯЗЫВАЮ:» отдельной строкой", ref: "instr_dou:9.7.4"}
  - {text: "Указано лицо, контролирующее исполнение распоряжения", ref: "instr_dou:9.7.5"}
  - {text: "Комитет определяет цель, статус, состав, председателя, секретаря, полномочия и срок деятельности", ref: "instr_dou:9.5.7"}
  - {text: "Отмена прежнего распоряжения оформляется распоряжением либо приказом с учётом п. 8.19.8", ref: "instr_dou:9.7.6"}
  - {text: "Срок рассмотрения проекта распоряжения — не более 3 рабочих дней", ref: "instr_dou:10.3"}
  - {text: "Обязательна лингвистическая экспертиза", ref: "instr_dou:10.13"}
  - {text: "Согласовать формы единственного/множественного числа, удалить квадратные скобки и номера примечаний", ref: "mr_modules:3.3"}
