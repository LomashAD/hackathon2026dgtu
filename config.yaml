# Конфигурация помощника по регламентам. Все параметры меняются здесь, без правки кода.

llm:
  base_url: ${OLLAMA_HOST:-http://localhost:11434}
  model: qwen2.5:1.5b-instruct        # заменить на qwen2.5:7b-instruct / 14b-instruct одной строкой
  temperature: 0
  num_ctx: 4096
  timeout_s: 120
  wait_s: 30                          # сколько ждать модель в диалоге; при очереди дольше — ответ без пояснения
  allow_remote: false                 # модель только во внутренней сети (localhost, частные адреса); иначе запуск — с ошибкой
  mask_pii: true                      # персональные данные из сообщений сотрудника маскируются до передачи модели
  explain: true                       # короткое пояснение «простыми словами» от модели
  rephrase_questions: true            # перефразирование вопросов при заполнении шаблона
  reformulate: true                   # второй шанс поиска: разговорный вопрос переписывается деловым языком
  max_explain_tokens: 220

embeddings:
  model: bge-m3                       # альтернатива: любая embedding-модель Ollama
  batch_size: 16

paths:
  data_dir: data
  storage_dir: storage
  index_dir: storage/chroma
  registry: storage/registry.json
  matrix: storage/matrix.json
  output_dir: storage/output
  audit_log: storage/logs/audit.jsonl
  feedback_log: storage/logs/feedback.jsonl
  unanswered_log: storage/logs/unanswered.jsonl
  app_log: storage/logs/app.log
  templates_yaml: templates_yaml
  templates_docx: storage/templates_docx
  news: storage/news.yaml             # новости портала (правятся в админ-панели)
  news_seed: news.yaml                # начальное наполнение: копируется в storage при первом запуске
  uploads: data/uploads               # новые редакции, загруженные через админ-панель
  users: storage/users.json           # учётные записи сотрудников (scripts/users.py, админ-панель)
  auth_secret: storage/auth_secret    # секрет подписи токенов входа (создаётся при первом запуске)

# Коллекции источников базы знаний. Новый документ = новая запись здесь
# (или scripts/ingest.py --doc ... --parser ...), код не меняется.
sources:
  - doc_id: instr_dou
    title: Инструкция по документационному обеспечению управления и документообороту Организации
    short_title: Инструкция по ДОУ
    file: data/Инструкция_по_ДОУ_учебный_пример.pdf
    parser: instruction_pdf
    version: "1.0"
    effective_date: "2026-11-01"
    access_level: internal
    # Отдельные пункты с повышенным уровнем доступа (демонстрация разграничения доступа, см. docs/decisions.md D-05)
    access_overrides:
      "2.11": confidential
      "11.13": confidential
      "11.23": confidential
  - doc_id: mr_modules
    title: Методические рекомендации по работе с модульными документами
    short_title: Метод. рекомендации по модульным документам
    file: data/Методические_рекомендации_по_работе_с_модульными_документами.docx
    parser: numbered_docx
    version: "1.0"
    effective_date: "2026-11-01"
    access_level: internal
  - doc_id: matrix_viz
    title: Матрица обязательного визирования проектов внутренних и внешних документов Организации
    short_title: Матрица обязательного визирования
    file: data/Матрица_обязательного_визирования_внутренних_и_внешних_документов.docx
    parser: approval_matrix            # загружается в таблицу; текст строк индексируется для поиска
    version: "1.0"
    effective_date: "2026-11-01"
    access_level: internal

# Уровни доступа (по возрастанию) и роли. Роль задаётся в учётной записи сотрудника (в продакшне — из SSO).
access_levels: [public, internal, confidential]
roles:
  employee:
    title: Сотрудник
    levels: [public, internal]
  admin:
    title: Администратор
    levels: [public, internal, confidential]
    can_view_archive: true
    can_manage_users: true             # админ-панель на портале
default_role: employee

retrieval:
  vector_k: 20             # кандидатов из векторного поиска
  bm25_k: 20               # кандидатов из BM25
  top_k: 4                 # фрагментов в ответ
  w_vector: 0.80           # вес векторной близости в итоговой релевантности
  w_bm25: 0.20             # вес лексического совпадения
  cos_low: 0.40            # косинус, соответствующий 0 % релевантности
  cos_high: 0.68           # косинус, соответствующий 100 % релевантности
  min_relevance: 0.50      # порог: ниже — «в базе знаний недостаточно информации»
  min_show: 0.40           # фрагменты ниже этого значения не показываются
  rel_gap: 0.20            # показывать только фрагменты не хуже (лучший − rel_gap)
  expand_refs: 2           # сколько связанных пунктов по refs подтягивать
  quote_max_chars: 1500    # длина цитаты пункта в ответе
  quote_count: 2           # сколько пунктов цитировать дословно (максимум)
  quote_gap: 0.03          # второй пункт цитируется, если его релевантность не ниже лучшей − quote_gap
  weak_relevance: 0.60     # описание ситуации без вопроса («письмо пришло не по адресу») с релевантностью ниже —
                           # тоже второй шанс поиска (llm.reformulate); при отказе второй шанс есть всегда
  alt_gain: 0.05           # ответ по переписанному вопросу берётся, только если он лучше на столько

# Разговорные выражения → термины Инструкции. Сотрудник пишет «письмо пришло не по адресу», а в Инструкции —
# «некорректная маршрутизация». Термин дописывается к запросу поиска (сотруднику не показывается).
# Новое выражение — новая запись здесь, без правки кода; when — регулярное выражение без учёта регистра.
colloquial_terms:
  - when: "не по адресу|не туда|не тому|чуж\\w+ (письм|документ|корреспонденц)|по ошибке|ошибочно (поступ|пришл|направ)|не в (наш|то|тот|ту|мой|мое|моё|мою)\\w* (отдел|подразделени|департамент|управлени)"
    add: "некорректная маршрутизация, передача документа в ответственное подразделение"
  - when: "(деньг|наличн|купюр)\\w*.{0,40}(конверт|письм|отправлени|посылк|пакет)|(конверт|письм|отправлени|посылк|пакет)\\w*.{0,40}(деньг|наличн|купюр)"
    add: "обнаружение денег и ценностей при вскрытии отправления"

# Куда обратиться, если ответа нет (из Инструкции: п. 2.1, 4.1.3, 12.4)
contacts:
  default:
    unit: Департамент документационного обеспечения (Департамент ДОУ); в РО Организации — подразделение ДОУ РО
    basis: "п. 2.1 и 4.1.3 Инструкции: Департамент ДОУ консультирует работников и подразделения, оказывает методическую поддержку"
    ref: {doc_id: instr_dou, section: "2.1"}
  access:
    unit: Департамент информационной безопасности (права пользователей ИИС ДО)
    basis: "п. 2.5 Инструкции"
    ref: {doc_id: instr_dou, section: "2.5"}
  iis:
    unit: Работники, назначенные координаторами ИИС ДО в подразделении; техническое администрирование — Департамент ДОУ
    basis: "п. 2.5 и 2.7 Инструкции"
    ref: {doc_id: instr_dou, section: "2.7"}
  hr:
    unit: Кадровое подразделение (приказы по личному составу)
    basis: "п. 7.6 и 9.6 Инструкции"
    ref: {doc_id: instr_dou, section: "9.6"}

security:
  mask_pii_in_logs: true
  max_message_chars: 2000
  password_min_length: 8
  login_max_failures: 5              # неудачных попыток входа подряд…
  login_lock_minutes: 5              # …после которых вход по логину закрыт на столько минут
  drafts_ttl_hours: 24               # сформированные черновики (в них ФИО) удаляются через столько часов

ui:
  title: Помощник по документообороту

portal:
  # Внутренние порталы, на которые встраивается виджет (<script src="https://<помощник>/widget.js" defer>):
  # адреса через пробел, например "https://portal.corp.example". Остальным сайтам iframe с чатом запрещён.
  # Портал должен быть на том же домене организации (cookie входа SameSite=Lax), в продакшне — SSO.
  embed_origins: ${PORTAL_ORIGINS:-}
