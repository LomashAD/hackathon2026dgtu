  - {id: d01, q: "Если отправлю распоряжение на согласование 12 ноября 2026, когда будет готово?", type: answer, expected: [instr_dou:10.3], text_contains: "17.11.2026"}
  - {id: d02, q: "К какому числу согласуют приказ, если отправить 30.12.2026?", type: answer, expected: [instr_dou:10.3], text_contains: "22.01.2027"}
