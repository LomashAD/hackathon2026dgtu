# Тестовые вопросы для оценки качества поиска и ответов.
# ВНИМАНИЕ: файла «Примеры пользовательских запросов» в data/ нет (docs/decisions.md, D-01).
# Вопросы сформулированы самостоятельно разговорным языком сотрудника; ожидаемые пункты сверены с текстом Инструкции.
#
# expected: список «doc_id:пункт», достаточно попадания любого из них в источники ответа.
# type: answer | no_answer | provocation | approval
# role: роль пользователя (по умолчанию employee)
# must_not_contain: пункты, которые не должны попасть в источники (проверка доступа)

questions:
  - id: q01
    q: Когда нужно зарегистрировать входящий документ?
    type: answer
    expected: [instr_dou:5.6]
  - id: q02
    q: Сколько адресатов можно указать в письме?
    type: answer
    expected: [instr_dou:8.12.4]
  - id: q03
