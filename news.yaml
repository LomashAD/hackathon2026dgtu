# Новости портала (вкладка «Новости»). Правятся здесь, без кода и без перезапуска:
# портал перечитывает файл при каждом открытии вкладки.
# О новых редакциях документов базы знаний (scripts/ingest.py --version …) лента сообщает сама.
#
# Поля новости:
#   date       — дата публикации, ГГГГ-ММ-ДД (обязательно); лента сортируется по ней, свежие сверху
#   title      — заголовок (обязательно)
#   text       — текст
#   unit       — рубрика или автор (над заголовком)
#   ask        — вопрос помощнику: кнопка покажет ответ прямо в карточке; ask_label — подпись кнопки
#   link       — ссылка внутри портала (#docs, #services, /?chat); link_label — подпись
#   open_chat  — true: кнопка «Открыть помощника»

items:
  - date: 2026-10-24
    unit: Новый сервис
    title: Помощник по документообороту
    text: >-
      Отвечает на вопросы по Инструкции со ссылками на пункты, подсказывает согласующих и сроки,
      готовит черновики приказов и распоряжений по модулям.
    open_chat: true

  - date: 2026-10-15
    unit: Департамент ДОУ
    title: С 1 ноября 2026 г. действует новая Инструкция по ДОУ
    text: >-
      Инструкция по документационному обеспечению управления и документообороту утверждена приказом
      от 15.10.2026 № ОД-184 и вступает в силу 1 ноября 2026 г. (п. 12.11).
    link: "#docs"
    link_label: К документам

  - date: 2026-10-15
    unit: Руководителям подразделений
    title: 60 дней на приведение локальных документов в соответствие
    text: >-
      В течение 60 календарных дней со дня вступления Инструкции в силу руководители приводят
      локальные документы, маршруты, шаблоны и роли в соответствие (п. 12.12).
    ask: Что нужно сделать руководителям подразделений после вступления Инструкции в силу?

  - date: 2026-10-15
    unit: ИИС ДО
    title: Настройка ИИС ДО под новые правила — 90 дней
    text: >-
      Департамент ИТ совместно с Департаментом ДОУ в течение 90 календарных дней настраивает
      справочники, статусы, маршруты и отчётность ИИС ДО (п. 12.13).
    ask: Что делать, если ИИС ДО не работает?
    ask_label: Что делать, если ИИС ДО недоступна?
